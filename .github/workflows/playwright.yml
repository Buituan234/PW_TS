  test02:
    name: Job2 - chạy test đa môi trường
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: ${{inputs.environments || 'DEV'}}
    steps:
      - name: step 1 - Check out code
        uses: actions/checkout@v4

      - name: step 2 - Cài node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: step 3 - cài dependencies từ package.json
        run: npm install

      - name: Step 4 - Chạy test để đọc env
        run: npx tsx tests/lessons/print-env.tsx
        env: 
          MY_PASSWORD: ${{secrets.MY_PASSWORD}}
          MY_WEBSITE: ${{vars.MY_WEBSITE}}


